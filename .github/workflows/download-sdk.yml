name: Android SDK İndirici (Kesin Çözüm)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Android.jar ve Framework.aidl İndir
        run: |
          mkdir -p sdk_files
          cd sdk_files
          
          echo "android.jar indiriliyor..."
          # wget kullanarak yönlendirmeleri tam takip eden ve dosya çeken güvenli komut
          wget -O android.jar "https://github.com/itsndk/android-jar/raw/master/android-33/android.jar"
          
          echo "framework.aidl indiriliyor..."
          wget -O framework.aidl "https://raw.githubusercontent.com/android/platform_frameworks_base/master/core/res/framework.aidl"
          
          # İnen dosyaların boyutlarını kontrol et
          ls -lh

      - name: Dosyaları Arşivle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AideSDK-Files
          path: sdk_files/
