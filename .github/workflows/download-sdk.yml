name: Android SDK İndirici (Kesin Çözüm)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Android.jar ve Framework.aidl İndir
        run: |
          mkdir -p sdk_files
          cd sdk_files
          
          echo "android.jar indiriliyor..."
          # Maven Central üzerinden çalışan resmi ve doğrudan indirme bağlantısı
          wget --content-disposition "https://search.maven.org/remotecontent?filepath=com/google/android/android/13/android-13.jar" -O android.jar
          
          echo "framework.aidl indiriliyor..."
          wget -O framework.aidl "https://raw.githubusercontent.com/android/platform_frameworks_base/master/core/res/framework.aidl"
          
          # Dosya boyutlarını kontrol et
          ls -lh

      - name: Dosyaları Arşivle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AideSDK-Files
          path: sdk_files/
